spring.application.name=expense-tracker-api
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/expensetracker}
spring.data.mongodb.database=${MONGODB_DATABASE:expensetracker}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration (256-bit secure key)
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8b2d4e7a9c1f3b5e7d9a1c3e5b7d9a1c3e5b7d9a1c3e5b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail Configuration (Brevo SMTP Relay)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:c03a0e001@smtp-brevo.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:adityashukla0913@gmail.com}

# Application Base URL for Links and CORS
app.base-url=${APP_BASE_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Default Secure Admin Provisioning (Used strictly on initial bootstrap if no admin exists)
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@aurafinance.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@123456}

# Logging configuration
logging.level.com.expensetracker=INFO
logging.level.org.springframework.security=WARN
